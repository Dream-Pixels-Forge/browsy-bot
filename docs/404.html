<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — browsy-bot</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --bg: #06060c; --bg-card: #10101c; --border: #1a1a2e;
      --fg: #e8e6f2; --fg-dim: #8a86a4; --accent: #7c3aed; --accent-hi: #a78bfa;
      --accent-glow: rgba(124, 58, 237, 0.12);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f5fa; --bg-card: #ffffff; --border: #ddd8ea;
        --fg: #1a1726; --fg-dim: #5d5978;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg);
      background-image: radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0);
      background-size: 32px 32px;
      color: var(--fg); font-family: var(--sans); text-align: center; padding: 24px;
    }
    .box { max-width: 420px; position: relative; }
    .box::before {
      content: ""; position: absolute; inset: -40% -10% auto; height: 60%;
      background: radial-gradient(300px 200px at 50% 0%, var(--accent-glow), transparent 70%);
      pointer-events: none;
    }
    .mark { width: 54px; height: 54px; margin: 0 auto 22px; display: grid; place-items: center;
      border-radius: 15px; background: var(--bg-card); border: 1px solid var(--border);
      color: var(--accent-hi); }
    .mark svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    .code { font-size: 56px; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 10px;
      background: linear-gradient(135deg, #7c3aed 0%, #a78bfa 50%, #c4b5fd 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font-size: 18px; font-weight: 650; margin: 0 0 8px; }
    p { color: var(--fg-dim); font-size: 14.5px; margin: 0 0 28px; }
    a.home {
      display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px;
      border-radius: 10px; background: var(--accent); color: #fff; font-size: 14px;
      font-weight: 600; text-decoration: none;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s;
    }
    a.home:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(124,58,237,0.25); }
    a.home svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .alt { margin-top: 22px; font-size: 13px; color: var(--fg-dim); }
    .alt a { color: var(--accent-hi); }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 6l8-4 8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10z"/><path d="M9 12l2.5 2.5L15.5 9"/></svg>
    </div>
    <div class="code">404</div>
    <h1>Nothing at this address.</h1>
    <p>The page you're looking for isn't here. The browsy-bot site lives one step up.</p>
    <a class="home" href="/browsy-bot/">
      <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      Back to the site
    </a>
    <div class="alt">or jump to the <a href="https://github.com/Dream-Pixels-Forge/browsy-bot">GitHub repository</a></div>
  </div>
</body>
</html>
